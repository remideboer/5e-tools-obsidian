name: Obsidian release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build plugin
        run: |
          npm ci
          npm run build:obsidian

      - name: Pack plugin
        run: |
          mkdir -p plugin/5etools
          cp build/obsidian/main.js build/obsidian/manifest.json build/obsidian/styles.css plugin/5etools/
          for dir in data search dice heic; do
            if [ -d "build/obsidian/$dir" ]; then
              cp -a "build/obsidian/$dir" "plugin/5etools/$dir"
            fi
          done
          (cd plugin && zip -r ../5etools.zip 5etools)

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite."
            exit 1
          fi
          NOTES="$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${RELEASE_TAG}" \
            --jq .body)"
          {
            echo "Unzip 5etools.zip into the vault's .obsidian/plugins folder. The result must be .obsidian/plugins/5etools. Then reload Obsidian."
            echo
            echo "$NOTES"
          } > release-notes.md
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            5etools.zip
